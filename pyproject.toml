[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sothe-p2"
version = "1.0.0"
description = "SOTHE-P2: the Paper-2 computations of the SOTHE project in Python (NumPy + Matplotlib)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Hasan Oguz", email = "hasan.oguz@okan.edu.tr"}]
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]

[project.optional-dependencies]
mat = ["scipy>=1.7"]

[project.urls]
Repository = "https://github.com/codekyha/Project_SOTHE/tree/p2"

# Editable installs only (pip install -e .): the pack folder holds data/, reference/, config/ and runs/,
# which the commands use.  `sothe-p2 <command>` is then the same as `python p2.py <command>`.
[project.scripts]
sothe-p2 = "sothe_p2.cli:main"

[tool.setuptools]
packages = ["sothe_p2", "sothe_p2.ref25"]

[tool.setuptools.package-data]
"sothe_p2.ref25" = ["LICENSE", "CITATION.cff"]
